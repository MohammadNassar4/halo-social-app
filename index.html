<!doctype html>
<html lang="en" class="scroll-smooth scrollbar-track-transparent scrollbar-thumb-accent scrollbar-thin">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halo</title>
    <link href="/src/style.css" rel="stylesheet" />
    <!-- to avoid flash on page load -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("halo-theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-body bg-bg text-fg text-sm sm:text-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
